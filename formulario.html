                    <input class="datosinput" type="date" id="fecha" name="fecha" placeholder="dd/mm/aa"><br>
                    <input class="datosinput" type="number" id="edad" name="edad" min="16" max="99"
                        placeholder="18 - 100"><br>
                        <div id="datoslabelseis">
                    <label for="contacto">Forma de contacto preferida</label>
                </div>
                <div id="datosinputtres">
                    <label class="labelinputtres"><input type="radio" name="contacto" value="Email">Email</label>

                    <label class="labelinputtres"><input type="radio" name="contacto" value="WhatsApp">WhatsApp</label>

                </div>
                </div>

                </div>

                    <label for="texto">Mensaje *</label>

                <div id="datoslabelocho">
